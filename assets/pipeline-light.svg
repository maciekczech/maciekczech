<line class="hair" x1="64" y1="121" x2="766" y2="121" stroke="#D1D9E0" stroke-width="1" opacity=".55"/>
<text x="415" y="143" class="tool" opacity="0" style="animation:s0 22s linear infinite">hermes-agent  ·  scratchpad</text>
<text x="415" y="163" class="tech" opacity="0" style="animation:s0 22s linear infinite">Python  ·  public data sources</text>
<text x="415" y="143" class="tool" opacity="0" style="animation:s1 22s linear infinite">Linear  ·  GitHub Projects</text>
<text x="415" y="163" class="tech" opacity="0" style="animation:s1 22s linear infinite">Markdown specs  ·  brainstorm, then grill it</text>
<text x="415" y="143" class="tool" opacity="0" style="animation:s2 22s linear infinite">Claude Code  ·  Codex  ·  Cursor  —  all driven through t3code</text>
<text x="415" y="163" class="tech" opacity="0" style="animation:s2 22s linear infinite">TypeScript  ·  Node  ·  Next.js  ·  Astro  ·  React  ·  Convex  ·  Supabase  ·  Clerk</text>
<text x="415" y="143" class="tool" opacity="0" style="animation:s3 22s linear infinite">Greptile  ·  CodeRabbit  ·  Macroscope  ·  Bugbot</text>
<text x="415" y="163" class="tech" opacity="0" style="animation:s3 22s linear infinite">GitHub pull requests  ·  every bot comment answered</text>
